minutes:$('#minutes')?+$('#minutes').value:room.settings.minutes,timed:$('#timed')?$('#timed').checked:room.settings.timed,hints:$('#hints')?$('#hints').checked:room.settings.hints,knowEachOther:$('#knowEachOther')?$('#knowEachOther').checked:room.settings.knowEachOther,votingSeconds:$('#voting-seconds')?+$('#voting-seconds').value:room.settings.votingSeconds||45,finalGuess:$('#final-guess')?$('#final-guess').checked:!!room.settings.finalGuess,verifiedOnly:$('#verified-only')?$('#verified-only').checked:!!room.settings.verifiedOnly})}function openCategoryEditor(){categoryDraft=[...(room.settings.categories||CATEGORY_LIST.map(c=>c.name))];categoryOpen=true;render()}function changeCategory(name,checked){categoryDraft=checked?[...new Set([...categoryDraft,name])]:categoryDraft.filter(x=>x!==name);render()}function categorySelectAll(all){categoryDraft=all?CATEGORY_LIST.map(c=>c.name):[];render()}function closeCategoryEditor(){if(!categoryDraft.length)return alert('Kamida bitta mavzuni tanlang');settings({categories:categoryDraft});categoryOpen=false;render()} function transferHost(target){const player=room?.players.find(p=>p.id===target);if(player&&confirm(player.name+'ni boshlovchi qilasizmi?'))send({type:'transferHost',target})}function leaveRoom(){GameTelegram.confirm('Xonadan chiqasizmi? Faol o‘yinchi chiqqanda o‘yindan chiqariladi. O‘yin qolganlar bilan davom etadi.',ok=>{if(ok)send({type:'leave'})})}function kick(target){if(confirm('O‘yinchini chiqarasizmi? Qolganlar o‘yinni davom ettiradi.'))send({type:'kick',target})}function shareTelegram(){if(room)GameTelegram.share(room.code)}function copyCode(){const url=GameTelegram.inviteURL(room.code);if(!navigator.clipboard){$('#error').textContent=url;return}navigator.clipboard.writeText(url).then(()=>{$('#error').textContent='Taklif havolasi nusxalandi'}).catch(()=>{$('#error').textContent=url})}chat=new RoomChat({getRoom:()=>room,send,escape:esc,isConnected:()=>connected});voice=new RoomVoice({getRoom:()=>room,send,escape:esc});addEventListener('game-telegram-ready',()=>{if(!entryName)entryName=GameTelegram.name;if(!room&&GameTelegram.code){entryCode=GameTelegram.code;entryMode='join'}render();followInvite()});addEventListener('game-telegram-back',()=>{if(categoryOpen)closeCategoryEditor();else if(nameOpen)cancelName();else if(room)leaveRoom();else entryScreen('home')});connect();render();
</script></body></html>
