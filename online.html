nel" aria-label="Xona suhbati"></section>`;if(room.phase==='lobby'){h+=`<h1>Do‘stlaringizni kuting</h1><div class="panel">${room.players.map(p=>`<div class="player">${esc(p.name)} ${p.id===room.me?'(siz)':''} ${p.id===room.players[0]?.id?'★':''} ${!p.connected?'— oflayn':''} ${host&&p.id!==room.me?`<button class="choice" onclick="kick('${p.id}')">CHIQARISH</button>`:''}</div>`).join('')}</div>`;if(host)h+=`<div class="settings-list"><label class="setting-row"><span class="symbol">👻</span><strong>Impostorlar</strong><select class="row-select" aria-label="Impostorlar soni" id="impostors" onchange="settings()">${[1,2,3].map(x=>`<option ${room.settings.impostors===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="setting-row"><span class="symbol">🔎</span><strong>Impostorga ishora</strong><input aria-label="Impostorga ishora" class="switch" id="hints" type="checkbox" ${room.settings.hints?'checked':''} onchange="settings()"></label><label class="setting-row"><span class="symbol">🤝</span><strong>Impostorlar bir-birini bilsin</strong><input aria-label="Impostorlar bir-birini bilsin" class="switch" id="knowEachOther" type="checkbox" ${room.settings.knowEachOther?'checked':''} ${room.settings.impostors<2?'disabled':''} onchange="settings()"></label><button class="setting-row" id="open-categories" onclick="openCategoryEditor()"><span class="symbol">👀</span><strong>Mavzular</strong><span class="value">${(room.settings.categories||CATEGORY_LIST).length} ta tanlangan ›</span></button><label class="setting-row"><span class="symbol">⏰</span><strong>Vaqt chegarasi</strong><input aria-label="Vaqt chegarasi" class="switch" id="timed" type="checkbox" ${room.settings.timed!==false?'checked':''} onchange="settings()"></label><label class="setting-row" ${room.settings.timed===false?'hidden':''}><span class="symbol">🕒</span><strong>Davomiylik</strong><input aria-label="Davomiylik" class="row-number" id="minutes" type="number" min="1" max="60" step="1" value="${room.settings.minutes}" onchange="settings()"><span class="value">daq.</span></label></div><p class="help">1–60 daqiqa. Ishora faqat mavzuni bildiradi; maxfiy so‘z berilmaydi.</p><div class="start-dock"><button class="btn" ${room.players.length<3?'disabled':''} onclick="send({type:'start'})">O‘yinni boshlash</button></div>`;else h+='<p class="note">Boshlovchi o‘yinni boshlashini kuting.</p>'}if(room.phase==='roles'){h+=`<h1>MAXFIY<br>ROLINGIZ.</h1><p>Rolingizni boshqalarga ko‘rsatmang.</p>${showRole?`<div class="secret ${role?.impostor?'bad':''}"><div class="tag" style="color:inherit">SIZNING ROLINGIZ</div><h2>${role?.impostor?'SIZ IMPOSTORSIZ!':esc(role?.word||'Yuklanmoqda...')}</h2>${role&&!role.impostor&&role.image?`<img class="word-picture" src="${esc(role.image)}" alt="${esc(role.word)} rasmi">`:''}<p style="color:inherit">${role?.impostor?'So‘zni bilmaysiz. O‘zingizni oshkor qilmang.':'So‘zni hech kimga aytmang.'}</p>${role?.hint?`<p style="color:inherit">Ishora: ${esc(role.hint)}</p>`:''}${role?.partners?.length?`<p style="color:inherit">Sheriklar: ${role.partners.map(p=>esc(p.name)).join(', ')}</p>`:''}</div><button class="btn black" onclick="showRole=false;render()">YASHIRISH</button>`:`<div class="secret"><h2>MAXFIY</h2><p>Faqat o‘zingiz qarang.</p></div><button class="btn" onclick="showRole=true;render()">ROLIMNI KO‘RISH</button>`}${host?'<button class="btn black" onclick="send({type:\'discuss\'})">MUHOKAMANI BOSHLASH →</button>':'<p>Boshlovchi muhokamani boshlashini kuting.</p>'}`}if(room.phase==='discussion'){h+=`<h1>IMPOSTORNI<br>TOPING.</h1><p>So‘zni aytmasdan ishora bering. Muhokama tugagach ovoz bering.</p><div class="timer" id="timer">${room.settings.minutes}:00</div>${host?'<button class="btn" onclick="send({type:\'voteStart\'})">OVOZ BERISH →</button>':'<p>Boshlovchi ovoz berishni boshlaydi.</p>'}`;const update=()=>{if(room.settings.timed===false){const el=$('#timer');if(el){el.textContent='∞';el.setAttribute('aria-label','Vaqt cheklanmagan')}return}const secs=Math.max(0,Math.ceil((room.deadline-Date.now()-clockOffset)/1000));const el=$('#timer');if(el)el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')};update();clock=setInterval(update,250)}if(room.phase==='voting'){h+=`<h1>KIM<br>IMPOSTOR?</h1><p>${me?.voted?'Ovozingiz qabul qilindi. Boshqalarni kuting.':'O‘zingizdan boshqa bir o‘yinchini tanlang.'}</p>${room.players.filter(p=>p.id!==room.me).map(p=>`<button class="choice ${selected===p.id?'active':''}" ${me?.voted?'disabled':''} onclick="selected='${p.id}';render()">${esc(p.name)}</button>`).join('')}${!me?.voted?`<button class="btn" ${!selected?'disabled':''} onclick="send({type:'vote',target:selected})">OVOZNI TASDIQLASH</button>`:''}<p>${room.votesCount} / ${room.players.length} ta ovoz</p>${host?'<button class="btn black" onclick="send({type:\'reveal\'})">OVOZ BERISHNI YAKUNLASH</button>':''}`}if(room.phase==='results'){const r=room.results||{counts:{},impostors:[]};h+=`<div class="secret"><div class="tag">NATIJA</div><h2>${r.caught?'ODDIY O‘YINCHILAR YUTDI!':'IMPOSTOR YUTDI!'}</h2><p>Maxfiy so‘z: <b>${esc(r.word)}</b></p><p>Impostor: <b>${r.impostors.map(id=>esc(room.players.find(p=>p.id===id)?.name||'?')).join(', ')}</b></p></div>${room.players.map(p=>`<div class="player">${esc(p.name)} <b style="float:right">${r.counts[p.id]||0} ta</b></div>`).join('')}${host?'<button class="btn" onclick="send({type:\'reset\'})">YANA O‘YNASH</button>':'<p>Boshlovchi yangi o‘yinni boshlashi mumkin.</p>'}`}if(host&&room.phase!=='lobby')h+=`<details class="panel"><summary>O‘yinchilarni boshqarish</summary>${room.players.filter(p=>p.id!==room.me).map(p=>`<button class="choice" onclick="kick('${p.id}')">${esc(p.name)} — CHIQARISH</button>`).join('')}</details>`;if(categoryOpen&&host&&room.phase==='lobby')h=categorySelector(categoryDraft,{online:true});else categoryOpen=false;}$('#screen').innerHTML=h;voice?.state(room);chat?.state(room)}
function entryScreen(mode){entryMode=mode;$('#error').textContent='';render();const field=$(mode==='join'?'#code':'#name');if(mode!=='home')field?.focus()}function enter(type){const name=$('#name')?.value.trim(),code=$('#code')?.value.trim().toUpperCase();if(!name){$('#error').textContent='Ismingizni kiriting';return}if(type==='join'&&(!code||code.length!==6)){$('#error').textContent='6 belgili xona kodini kiriting';return}send({type,name,code,clientId})}function settings(extra={}){const categories=extra.categories||room.settings.categories||CATEGORY_LIST.map(c=>c.name);send({type:'settings',category:categories.length===1?categories[0]:'Tasodifiy',categories,impostors:$('#impostors')?+$('#impostors').value:room.settings.impostors,minutes:$('#minutes')?+$('#minutes').value:room.settings.minutes,timed:$('#timed')?$('#timed').checked:room.settings.timed,hints:$('#hints')?$('#hints').checked:room.settings.hints,knowEachOther:$('#knowEachOther')?$('#knowEachOther').checked:room.settings.knowEachOther})}function openCategoryEditor(){categoryDraft=[...(room.settings.categories||CATEGORY_LIST.map(c=>c.name))];categoryOpen=true;render()}function changeCategory(name,checked){categoryDraft=checked?[...new Set([...categoryDraft,name])]:categoryDraft.filter(x=>x!==name);render()}function categorySelectAll(all){categoryDraft=all?CATEGORY_LIST.map(c=>c.name):[];render()}function closeCategoryEditor(){if(!categoryDraft.length)return alert('Kamida bitta mavzuni tanlang');settings({categories:categoryDraft});categoryOpen=false;render()} function kick(target){if(confirm('O‘yinchini chiqarasizmi? Faol raund bekor qilinadi.'))send({type:'kick',target})}function copyCode(){navigator.clipboard?.writeText(room.code).then(()=>{$('#error').textContent='Kod nusxalandi'}).catch(()=>{$('#error').textContent='Kod: '+room.code})}chat=new RoomChat({getRoom:()=>room,send,escape:esc,isConnected:()=>connected});voice=new RoomVoice({getRoom:()=>room,send,escape:esc});connect();render();
</script></body></html>
