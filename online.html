<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Onlayn — IMPOSTOR KIM?</title><style>:root{font-family:Arial,sans-serif;color:#111;background:white}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;padding:25px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.red{color:#d71920}.tiny{color:#777;font-size:12px}.tag{color:#d71920;font-size:12px;letter-spacing:2px;font-weight:900}h1{font-size:clamp(38px,10vw,58px);letter-spacing:-2px;line-height:1;margin:12px 0 25px}h2{font-size:30px}p{line-height:1.5;color:#666}.panel{border:1px solid #ddd;border-radius:14px;padding:20px;margin:18px 0}.field{display:block;width:100%;padding:15px;border:1px solid #ccc;border-radius:9px;font:inherit;margin:9px 0 16px;background:white;color:#111}.btn{display:block;width:100%;background:#d71920;color:white;border:0;border-radius:10px;padding:17px;font-size:15px;font-weight:800;cursor:pointer;margin:10px 0}.btn.black{background:#111}.btn.light{background:white;border:1px solid #ddd;color:#111}.btn:disabled{opacity:.4;cursor:not-allowed}.choice{width:100%;padding:16px;border:1px solid #ddd;background:white;text-align:left;border-radius:10px;margin:5px 0;font:inherit;font-weight:bold;cursor:pointer}.choice.active{border:2px solid #d71920}.secret{border:2px solid #111;padding:40px 20px;min-height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;border-radius:15px;margin:22px 0}.secret.bad{background:#d71920;color:white;border-color:#d71920}.secret h2{overflow-wrap:anywhere}.code{font-size:48px;letter-spacing:7px;font-weight:900;text-align:center;margin:16px 0}.note{background:#f5f5f5;padding:14px;border-radius:10px;font-size:13px}.player{padding:12px 0;border-bottom:1px solid #eee}.error{color:#d71920;font-weight:bold;font-size:13px}.status{font-size:12px;color:#777}.timer{font-size:72px;text-align:center;font-weight:900;letter-spacing:-3px}.back{color:#111;text-decoration:none;font-weight:800}.hidden{display:none}</style></head><body><main class="app"><header class="top"><div class="brand">IMPOSTOR <span class="red">KIM?</span></div><span class="status" id="status">Ulanmoqda...</span></header><div id="screen"></div><p class="error" id="error" role="alert"></p></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let ws,room=null,role=null,selected=null,showRole=false,now=Date.now(),discussionStart=null,clock=null,connected=false;const clientId=localStorage.getItem('impostor-device')||crypto.randomUUID();localStorage.setItem('impostor-device',clientId);let clockOffset=0;const saved=()=>{try{return JSON.parse(sessionStorage.getItem('impostor-online')||'null')}catch{return null}};function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m));else $('#error').textContent='Internetga ulanish kutilmoqda'}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>{connected=true;$('#status').textContent='● ONLAYN';let s=saved();if(s)send({type:'resume',...s});else render()};ws.onclose=()=>{connected=false;$('#status').textContent='● ULANISH YO‘Q';setTimeout(connect,2500)};ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='kicked'){sessionStorage.removeItem('impostor-online');room=null;role=null;render();$('#error').textContent='Siz xonadan chiqarildingiz.';return}if(m.type==='notice'){alert(m.message);return}if(m.type==='error'){if(m.message.includes('Sessiya tugagan')){sessionStorage.removeItem('impostor-online');room=null}$('#error').textContent=m.message;render();return}$('#error').textContent='';if(m.type==='joined'){sessionStorage.setItem('impostor-online',JSON.stringify({code:m.code,token:m.token}))}if(m.type==='role'){role=m;showRole=false}if(m.type==='state'){clockOffset=m.serverNow-Date.now();if(m.phase==='lobby'||m.phase==='results'||room?.round!==m.round)role=null;if(room?.phase!==m.phase){selected=null;showRole=false;if(m.phase==='discussion')discussionStart=Date.now()}room=m}render()}}function render(){clearInterval(clock);let h='';if(!room){h=`<a class="back" href="index.html">← BOSH SAHIFA</a><div class="tag" style="margin-top:28px">ONLAYN REJIM</div><h1>BIRGA<br>O‘YNANG.</h1><p>Har bir o‘yinchi o‘z telefonidan kiradi.</p><label>Ismingiz</label><input class="field" id="name" maxlength="24" placeholder="Ismingiz"><button class="btn" onclick="enter('create')">XONA YARATISH →</button><div class="panel"><b>Xonaga qo‘shilish</b><input class="field" id="code" maxlength="6" placeholder="6 belgili kod" style="text-transform:uppercase"><button class="btn black" onclick="enter('join')">QO‘SHILISH →</button></div>`}else{const host=room.host,me=room.players.find(p=>p.id===room.me);h=`<div class="tag">XONA: ${esc(room.code)}</div><div class="code">${esc(room.code)}</div><button class="btn light" onclick="copyCode()">KODNI NUSXALASH</button>`;if(room.phase==='lobby'){h+=`<h1>O‘YINCHILAR<br>TO‘PLANMOQDA.</h1><div class="panel">${room.players.map(p=>`<div class="player">${esc(p.name)} ${p.id===room.me?'(siz)':''} ${p.id===room.players[0]?.id?'★':''} ${!p.connected?'— oflayn':''} ${host&&p.id!==room.me?`<button class="choice" onclick="kick('${p.id}')">CHIQARISH</button>`:''}</div>`).join('')}</div>`;if(host)h+=`<label>Mavzu</label><select class="field" id="category" onchange="settings()">${['Tasodifiy','Oziq-ovqat','Joylar','Hayvonlar','Buyumlar','Kasblar'].map(x=>`<option ${room.settings.category===x?'selected':''}>${x}</option>`).join('')}</select><label>Impostorlar soni</label><select class="field" id="impostors" onchange="settings()">${[1,2,3].map(x=>`<option ${room.settings.impostors===x?'selected':''}>${x}</option>`).join('')}</select><label>Muhokama vaqti</label><input class="field" id="minutes" type="number" min="1" max="60" step="1" value="${room.settings.minutes}" onchange="settings()"><p class="tiny">1–60 daqiqa</p><label><input id="hints" type="checkbox" ${room.settings.hints?'checked':''} onchange="settings()"> Impostorga ishora (faqat mavzu)</label><p class="tiny">Maxfiy so‘z impostorga berilmaydi.</p><label><input id="knowEachOther" type="checkbox" ${room.settings.knowEachOther?'checked':''} ${room.settings.impostors<2?'disabled':''} onchange="settings()"> Impostorlar bir-birini bilsin (2+)</label><button class="btn" ${room.players.length<3?'disabled':''} onclick="send({type:'start'})">O‘YINNI BOSHLASH →</button>`;else h+='<p class="note">Boshlovchi o‘yinni boshlashini kuting.</p>'}if(room.phase==='roles'){h+=`<h1>MAXFIY<br>ROLINGIZ.</h1><p>Rolingizni boshqalarga ko‘rsatmang.</p>${showRole?`<div class="secret ${role?.impostor?'bad':''}"><div class="tag" style="color:inherit">SIZNING ROLINGIZ</div><h2>${role?.impostor?'SIZ IMPOSTORSIZ!':esc(role?.word||'Yuklanmoqda...')}</h2><p style="color:inherit">${role?.impostor?'So‘zni bilmaysiz. O‘zingizni oshkor qilmang.':'So‘zni hech kimga aytmang.'}</p>${role?.hint?`<p style="color:inherit">Ishora: ${esc(role.hint)}</p>`:''}${role?.partners?.length?`<p style="color:inherit">Sheriklar: ${role.partners.map(p=>esc(p.name)).join(', ')}</p>`:''}</div><button class="btn black" onclick="showRole=false;render()">YASHIRISH</button>`:`<div class="secret"><h2>MAXFIY</h2><p>Faqat o‘zingiz qarang.</p></div><button class="btn" onclick="showRole=true;render()">ROLIMNI KO‘RISH</button>`}${host?'<button class="btn black" onclick="send({type:\'discuss\'})">MUHOKAMANI BOSHLASH →</button>':'<p>Boshlovchi muhokamani boshlashini kuting.</p>'}`}if(room.phase==='discussion'){h+=`<h1>IMPOSTORNI<br>TOPING.</h1><p>So‘zni aytmasdan ishora bering. Muhokama tugagach ovoz bering.</p><div class="timer" id="timer">${room.settings.minutes}:00</div>${host?'<button class="btn" onclick="send({type:\'voteStart\'})">OVOZ BERISH →</button>':'<p>Boshlovchi ovoz berishni boshlaydi.</p>'}`;const update=()=>{const secs=Math.max(0,Math.ceil((room.deadline-Date.now()-clockOffset)/1000));const el=$('#timer');if(el)el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')};update();clock=setInterval(update,250)}if(room.phase==='voting'){h+=`<h1>KIM<br>IMPOSTOR?</h1><p>${me?.voted?'Ovozingiz qabul qilindi. Boshqalarni kuting.':'O‘zingizdan boshqa bir o‘yinchini tanlang.'}</p>${room.players.filter(p=>p.id!==room.me).map(p=>`<button class="choice ${selected===p.id?'active':''}" ${me?.voted?'disabled':''} onclick="selected='${p.id}';render()">${esc(p.name)}</button>`).join('')}${!me?.voted?`<button class="btn" ${!selected?'disabled':''} onclick="send({type:'vote',target:selected})">OVOZNI TASDIQLASH</button>`:''}<p>${room.votesCount} / ${room.players.length} ta ovoz</p>${host?'<button class="btn black" onclick="send({type:\'reveal\'})">OVOZ BERISHNI YAKUNLASH</button>':''}`}if(room.phase==='results'){const r=room.results||{counts:{},impostors:[]};h+=`<div class="secret"><div class="tag">NATIJA</div><h2>${r.caught?'ODDIY O‘YINCHILAR YUTDI!':'IMPOSTOR YUTDI!'}</h2><p>Maxfiy so‘z: <b>${esc(r.word)}</b></p><p>Impostor: <b>${r.impostors.map(id=>esc(room.players.find(p=>p.id===id)?.name||'?')).join(', ')}</b></p></div>${room.players.map(p=>`<div class="player">${esc(p.name)} <b style="float:right">${r.counts[p.id]||0} ta</b></div>`).join('')}${host?'<button class="btn" onclick="send({type:\'reset\'})">YANA O‘YNASH</button>':'<p>Boshlovchi yangi o‘yinni boshlashi mumkin.</p>'}`}if(host&&room.phase!=='lobby')h+=`<details class="panel"><summary>O‘yinchilarni boshqarish</summary>${room.players.filter(p=>p.id!==room.me).map(p=>`<button class="choice" onclick="kick('${p.id}')">${esc(p.name)} — CHIQARISH</button>`).join('')}</details>`}$('#screen').innerHTML=h}
function enter(type){const name=$('#name')?.value.trim(),code=$('#code')?.value.trim().toUpperCase();if(!name){$('#error').textContent='Ismingizni kiriting';return}if(type==='join'&&(!code||code.length!==6)){$('#error').textContent='6 belgili xona kodini kiriting';return}send({type,name,code,clientId})}function settings(){send({type:'settings',category:$('#category').value,impostors:+$('#impostors').value,minutes:+$('#minutes').value,hints:$('#hints').checked,knowEachOther:$('#knowEachOther').checked})}function kick(target){if(confirm('O‘yinchini chiqarasizmi? Faol raund bekor qilinadi.'))send({type:'kick',target})}function copyCode(){navigator.clipboard?.writeText(room.code).then(()=>{$('#error').textContent='Kod nusxalandi'}).catch(()=>{$('#error').textContent='Kod: '+room.code})}connect();render();
</script></body></html>
