<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><title>IMPOSTOR KIM?</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:500px;margin:auto;padding:22px 20px 42px;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px}.brand{font-weight:900;letter-spacing:-1px;font-size:22px}.red{color:#d71920}.tiny{font-size:12px;color:#666}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#d71920;text-transform:uppercase}.headline{font-size:clamp(36px,10vw,57px);line-height:.99;letter-spacing:-2.5px;margin:12px 0 18px;font-weight:950}.desc{line-height:1.55;color:#666;margin-bottom:30px}.hero{background:#111;color:white;border-radius:18px;padding:30px 24px;margin-bottom:20px}.hero .headline{font-size:clamp(38px,10vw,52px)}.btn{border:0;background:#d71920;color:#fff;border-radius:11px;padding:17px 18px;font-weight:800;width:100%;margin:7px 0}.btn.black{background:#111}.btn.ghost{background:white;border:1px solid #ddd;color:#111}.btn.small{padding:12px;width:auto}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{border:1px solid #ddd;border-radius:14px;padding:18px;text-align:left;background:white;min-height:118px}.mode strong{display:block;margin:10px 0 5px}.mode span{font-size:12px;color:#777}.panel{border:1px solid #e0e0e0;border-radius:16px;padding:20px;margin:18px 0}.label{font-size:13px;font-weight:800;display:block;margin:18px 0 8px}.field{width:100%;padding:15px;border:1px solid #d6d6d6;border-radius:10px;background:white;color:#111}.counter{display:flex;align-items:center;justify-content:space-between}.counter button{border:1px solid #ddd;border-radius:9px;background:#fff;font-size:24px;width:46px;height:46px}.count{font-size:32px;font-weight:900}.pill{display:inline-block;border:1px solid #ddd;padding:8px 12px;border-radius:100px;font-size:12px;margin:4px 4px 4px 0}.progress{height:5px;background:#eee;border-radius:8px;overflow:hidden;margin:20px 0}.progress div{height:100%;background:#d71920}.secret{border:2px solid #111;border-radius:16px;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px;margin:25px 0}.secret h2{font-size:38px;line-height:1.05;letter-spacing:-1px;overflow-wrap:anywhere}.secret.impostor{border-color:#d71920;background:#d71920;color:white}.timer{font-size:76px;letter-spacing:-4px;font-weight:900;text-align:center;margin:35px 0}.choice{width:100%;border:1px solid #ddd;border-radius:10px;background:#fff;text-align:left;padding:16px;margin:6px 0;font-weight:700}.choice.active{border:2px solid #d71920;background:#fff4f4}.result{text-align:center;border:2px solid #111;border-radius:16px;padding:30px 20px;margin:24px 0}.result h2{font-size:34px}.back{border:0;background:none;font-weight:800;padding:10px 0}.note{background:#f6f6f6;border-radius:10px;padding:14px;font-size:13px;line-height:1.5;color:#555}.center{text-align:center}.code{font-size:46px;letter-spacing:8px;font-weight:900}.hidden{display:none!important}@media(min-width:650px){.app{padding-top:38px}.top{margin-bottom:65px}}
</style></head><body><main class="app"><header class="top"><div class="brand">IMPOSTOR <span class="red">KIM?</span></div><div class="tiny">O‘ZBEKCHA O‘YIN</div></header><div id="screen"></div></main><script>
const WORDS={"Oziq-ovqat":["Osh","Somsa","Manti","Lag‘mon","Shashlik","Norin","Sumalak","Chuchvara","Tandir non","Qovun","Tarvuz","Muzqaymoq","Palov","Shurva","Choy","Kabob","Patir","Holva","Qurut","Mastava"],"Joylar":["Maktab","Bozor","Kutubxona","Stadion","Aeroport","Shifoxona","Choyxona","Metro","Kinoteatr","Muzey","Bog‘","Tog‘","Sohil","Masjid","Mehmonxona","Restoran","Vokzal","Dorixona","Universitet","Sartaroshxona"],"Hayvonlar":["Mushuk","It","Sher","Fil","Ot","Sigir","Tulki","Bo‘ri","Ayiq","Maymun","Tovuq","Burgut","Quyon","Toshbaqa","Timsoh","Pingvin","Ilon","Baliq","Tuya","Jirafa"],"Buyumlar":["Telefon","Kalit","Ko‘zoynak","Sumka","Soat","Qalam","Kitob","Kompyuter","Stul","Stol","Velosiped","Oyna","Soyabon","Qaychi","Televizor","Chiroq","Piyola","Muzlatkich","Koptok","Gilam"],"Kasblar":["O‘qituvchi","Shifokor","Dizayner","Dasturchi","Oshpaz","Haydovchi","Uchuvchi","Sartarosh","Aktyor","Qo‘shiqchi","Muhandis","Sotuvchi","Jurnalist","Tarjimon","Fotograf","Quruvchi","Advokat","Dehqon","Militsioner","Rassom"]};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={screen:'home',names:['1-o‘yinchi','2-o‘yinchi','3-o‘yinchi','4-o‘yinchi'],category:'Tasodifiy',impostors:1,minutes:3,round:null,reveal:0,shown:false,votes:[],voter:0,selected:null,seconds:180,running:false,timer:null,online:null};
function render(){clearInterval(state.timer);state.timer=null;let h='';switch(state.screen){case'home':h=`<section class="hero"><div class="eyebrow">DO‘STLAR BILAN O‘YIN</div><h1 class="headline">ORAMIZDA<br>KIMDIR<br><span class="red">YOLG‘ONCHI.</span></h1><p style="color:#ccc;line-height:1.5">So‘zni bilmagan impostorni toping. Hech kimga ishonmang!</p><button class="btn" onclick="go('setup')">O‘YINNI BOSHLASH →</button></section><div class="modes"><button class="mode" onclick="go('setup')">▣<strong>Oflayn o‘yin</strong><span>Bitta telefon bilan</span></button><button class="mode" onclick="go('online')">◎<strong>Onlayn o‘yin</strong><span>Har kim o‘z telefonida</span></button></div>`;break;
case'setup':h=`<button class="back" onclick="go('home')">← ORQAGA</button><div class="eyebrow">01 / SOZLAMALAR</div><h1 class="headline">O‘YINNI<br>SOZLANG.</h1><div class="panel"><div class="counter"><b>O‘yinchilar</b><div><button onclick="resizePlayers(-1)">−</button> <span class="count">${state.names.length}</span> <button onclick="resizePlayers(1)">+</button></div></div><div id="names">${state.names.map((n,i)=>`<label class="label">${i+1}-o‘yinchi</label><input class="field" maxlength="24" value="${esc(n)}" oninput="state.names[${i}]=this.value">`).join('')}</div><label class="label">Impostorlar soni</label><select class="field" onchange="state.impostors=+this.value">${Array.from({length:Math.min(3,state.names.length-2)},(_,i)=>`<option value="${i+1}" ${state.impostors===i+1?'selected':''}>${i+1} ta</option>`).join('')}</select><label class="label">Mavzu</label><select class="field" onchange="state.category=this.value">${['Tasodifiy',...Object.keys(WORDS)].map(x=>`<option ${state.category===x?'selected':''}>${x}</option>`).join('')}</select><label class="label">Muhokama vaqti</label><select class="field" onchange="state.minutes=+this.value">${[1,2,3,5,7,10].map(x=>`<option value="${x}" ${state.minutes===x?'selected':''}>${x} daqiqa</option>`).join('')}</select></div><button class="btn" onclick="startLocal()">ROLLARNI TARQATISH →</button>`;break;
case'reveal':{let p=state.reveal;h=`<div class="eyebrow">02 / MAXFIY ROL</div><h1 class="headline">${esc(state.names[p])}</h1><p class="desc">Telefonni faqat shu o‘yinchiga bering.</p><div class="progress"><div style="width:${p/state.names.length*100}%"></div></div>${state.shown?`<div class="secret ${state.round.impostors.includes(p)?'impostor':''}"><div class="eyebrow" style="color:inherit">SIZNING ROLINGIZ</div><h2>${state.round.impostors.includes(p)?'SIZ IMPOSTORSIZ!':esc(state.round.word)}</h2><p>${state.round.impostors.includes(p)?'So‘zni bilmaysiz. Boshqalarga bildirmang.':'So‘zni hech kimga aytmang.'}</p></div><button class="btn black" onclick="nextReveal()">YASHIRISH VA DAVOM ETISH →</button>`:`<div class="secret"><div style="font-size:50px">◉</div><h2>MAXFIY</h2><p>Atrofingizdagilar ekranga qaramasin.</p></div><button class="btn" onclick="state.shown=true;render()">ROLIMNI KO‘RISH</button>`}`;break;}
case'discuss':h=`<div class="eyebrow">03 / MUHOKAMA</div><h1 class="headline">IMPOSTORNI<br>TOPING.</h1><p class="desc">Navbat bilan so‘zga ishora qiling. So‘zni to‘g‘ridan-to‘g‘ri aytmang!</p><div class="timer" id="clock">${fmt(state.seconds)}</div><button class="btn black" onclick="toggleTimer()" id="timerbtn">${state.running?'TO‘XTATISH':'TAYMERNI BOSHLASH'}</button><button class="btn" onclick="state.voter=0;state.votes=[];go('vote')">OVOZ BERISH →</button>`;if(state.running) startTicker();break;
case'vote':h=`<div class="eyebrow">04 / OVOZ BERISH</div><h1 class="headline">KIM<br>IMPOSTOR?</h1><p class="desc">${esc(state.names[state.voter])}, kimdan shubhalanyapsiz? Ovoz berishni yashirin bajaring.</p>${state.names.map((n,i)=>`<button class="choice ${state.selected===i?'active':''}" onclick="state.selected=${i};render()">${i+1}. ${esc(n)}</button>`).join('')}<button class="btn" ${state.selected===null?'disabled':''} onclick="castVote()">OVOZNI TASDIQLASH →</button>`;break;
case'result':{let tall=state.names.map((_,i)=>state.votes.filter(v=>v===i).length);let max=Math.max(...tall),leaders=tall.map((v,i)=>v===max?i:-1).filter(i=>i>=0),caught=leaders.length===1&&state.round.impostors.includes(leaders[0]);h=`<div class="eyebrow">05 / NATIJA</div><div class="result"><div class="eyebrow">${caught?'IMPOSTOR TOPILDI':'IMPOSTOR QUTULDI'}</div><h2>${caught?'ODDIY O‘YINCHILAR YUTDI!':'IMPOSTOR YUTDI!'}</h2><p>Maxfiy so‘z: <b>${esc(state.round.word)}</b></p><p>Impostor: <b>${state.round.impostors.map(i=>esc(state.names[i])).join(', ')}</b></p></div><h3>Ovozlar</h3>${state.names.map((n,i)=>`<div class="choice">${esc(n)} <b style="float:right">${tall[i]} ta</b></div>`).join('')}<p class="tiny">Teng ovoz bo‘lsa, impostor g‘olib hisoblanadi. Bir nechta impostorli o‘yinda bittasini topish kifoya.</p><button class="btn" onclick="startLocal()">YANA O‘YNASH ↻</button><button class="btn ghost" onclick="go('setup')">SOZLAMALARGA QAYTISH</button>`;break;}
case'online':location.href='online.html';return;break;}$('#screen').innerHTML=h;}
function go(s){state.screen=s;state.running=false;render();window.scrollTo(0,0)}function resizePlayers(d){let n=state.names.length+d;if(n<3||n>15)return;if(d>0)state.names.push(`${n}-o‘yinchi`);else state.names.pop();state.impostors=Math.min(state.impostors,n-2);render()}function rand(n){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}function startLocal(){state.names=state.names.map((x,i)=>x.trim()||`${i+1}-o‘yinchi`);let cats=state.category==='Tasodifiy'?Object.keys(WORDS):[state.category];let cat=cats[rand(cats.length)],word=WORDS[cat][rand(WORDS[cat].length)];let indices=state.names.map((_,i)=>i);for(let i=indices.length-1;i>0;i--){let j=rand(i+1);[indices[i],indices[j]]=[indices[j],indices[i]]}state.round={word,impostors:indices.slice(0,state.impostors)};state.reveal=0;state.shown=false;state.seconds=state.minutes*60;state.selected=null;go('reveal')}function nextReveal(){state.shown=false;state.reveal++;if(state.reveal>=state.names.length)go('discuss');else render()}function fmt(n){return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`}function startTicker(){state.timer=setInterval(()=>{if(state.seconds>0){state.seconds--;let e=$('#clock');if(e)e.textContent=fmt(state.seconds)}else{state.running=false;clearInterval(state.timer);let b=$('#timerbtn');if(b)b.textContent='VAQT TUGADI'}},1000)}function toggleTimer(){state.running=!state.running;render()}function castVote(){if(state.selected===null)return;state.votes.push(state.selected);state.selected=null;state.voter++;if(state.voter===state.names.length)go('result');else render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
