function editorTitle(title){return '<div class="editor-title"><button class="back" aria-label="Orqaga" onclick="go(\'setup\')">‹</button><h1>'+title+'</h1></div>'}function removeLocal(x){if(state.names.length<=3)return;state.names.splice(x,1);state.impostors=Math.min(state.impostors,state.names.length-2);render()}function saveDuration(){const n=+$('#custom-minutes').value;if(!Number.isInteger(n)||n<1||n>60)return alert('1–60 oralig‘ida butun son kiriting');state.minutes=n;go('setup')}function saveCustom(){const words=[...new Set($('#custom-words').value.split(/\n/).map(x=>x.trim().slice(0,50)).filter(Boolean))].slice(0,100);if(words.length<3)return alert('Kamida 3 ta so‘z kiriting');state.customWords=words;WORDS['O‘z so‘zlarim']=words;try{localStorage.setItem('impostor-custom',JSON.stringify(words))}catch{}state.category='O‘z so‘zlarim';go('setup')}function go(s){state.screen=s;state.running=false;render();window.scrollTo(0,0)}function resizePlayers(d){let n=state.names.length+d;if(n<3||n>15)return;if(d>0)state.names.push(`${n}-o‘yinchi`);else state.names.pop();state.impostors=Math.min(state.impostors,n-2);render()}function rand(n){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}function startLocal(){if(!Number.isInteger(state.minutes)||state.minutes<1||state.minutes>60){alert('Vaqt 1–60 daqiqa bo‘lsin');return}state.names=state.names.map((x,i)=>x.trim()||`${i+1}-o‘yinchi`);let cats=state.category==='Tasodifiy'?Object.keys(WORDS).filter(x=>x!=='O‘z so‘zlarim'):[state.category];let cat=cats[rand(cats.length)],word=WORDS[cat][rand(WORDS[cat].length)];let indices=state.names.map((_,i)=>i);for(let i=indices.length-1;i>0;i--){let j=rand(i+1);[indices[i],indices[j]]=[indices[j],indices[i]]}state.round={word,category:cat,impostors:indices.slice(0,state.impostors)};state.reveal=0;state.shown=false;state.seconds=state.minutes*60;state.selected=null;go('reveal')}function nextReveal(){state.shown=false;state.reveal++;if(state.reveal>=state.names.length){go('discuss');if(state.timed){state.running=true;render()}}else render()}function fmt(n){return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`}function startTicker(){state.timer=setInterval(()=>{if(state.seconds>0){state.seconds--;let e=$('#clock');if(e)e.textContent=fmt(state.seconds)}else{state.running=false;clearInterval(state.timer);let b=$('#timerbtn');if(b)b.textContent='VAQT TUGADI'}},1000)}function toggleTimer(){state.running=!state.running;render()}function castVote(){if(state.selected===null)return;state.votes.push(state.selected);state.selected=null;state.voter++;if(state.voter===state.names.length)go('result');else render()}try{const words=JSON.parse(localStorage.getItem('impostor-custom')||'[]');if(Array.isArray(words)&&words.length>=3&&words.every(x=>typeof x==='string')){state.customWords=words.slice(0,100).map(x=>x.slice(0,50));WORDS['O‘z so‘zlarim']=state.customWords}}catch{}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
