case'vote':h=`<p id="vote-clock">${state.voteRemaining} soniya</p><div class="eyebrow">04 / OVOZ BERISH</div><h1 class="headline">KIM<br>IMPOSTOR?</h1><p class="desc">${esc(state.names[state.voter])}, kimdan shubhalanyapsiz? Ovoz berishni yashirin bajaring.</p>${state.names.map((n,i)=>state.eliminated.includes(i)||i===state.voter?'':`<button class="choice ${state.selected===i?'active':''}" onclick="state.selected=${i};render()">${i+1}. ${esc(n)}</button>`).join('')}<button class="btn" ${state.selected===null?'disabled':''} onclick="castVote()">OVOZNI TASDIQLASH →</button><button class="btn light" onclick="castVote(true)">O‘tkazib yuborish</button><button class="btn black" id="end-voting" onclick="finishLocalVote(true)">OVOZ BERISHNI YAKUNLASH</button><p class="help">Boshlovchi uchun: faqat berilgan ovozlar hisoblanadi.</p>`;state.timer=setInterval(()=>{state.voteRemaining--;const el=$('#vote-clock');if(el)el.textContent=state.voteRemaining+' soniya';if(state.voteRemaining<=0)castVote(true)},1000);break;
case'guess':h=`<h1>Oxirgi taxmin</h1><p>${esc(state.names[state.lastVote.target])}, maxfiy so‘zni toping. Bitta imkoniyat bor.</p><p id="guess-clock">${state.guessRemaining} soniya</p><form onsubmit="event.preventDefault();localGuess()"><input class="field" id="guess-word" maxlength="60" required autocomplete="off"><button class="btn">Taxminni yuborish</button></form>`;state.timer=setInterval(()=>{state.guessRemaining--;const el=$('#guess-clock');if(el)el.textContent=state.guessRemaining+' soniya';if(state.guessRemaining<=0)go('result')},1000);break;
case'result':{const outcome=state.outcome||RoundRules.resolve(state.names.map((_,i)=>i),state.round.impostors,state.eliminated,state.votes),tall=state.names.map((_,i)=>outcome.counts[i]||0),caught=outcome.winner==='civilians';h=`<div class="result"><h2>IMPOSTORLAR YUTDI!</h2><p>${state.outcome?.guessed?'Impostor maxfiy so‘zni topdi.':'Impostorlar soni oddiy o‘yinchilarga tenglashdi.'}</p><p>Maxfiy so‘z: <b>${esc(state.round.word)}</b></p><p>Impostorlar: <b>${state.round.impostors.map(i=>esc(state.names[i])).join(', ')}</b></p></div><button class="btn" onclick="startLocal()">Shu o‘yinchilar bilan yana o‘ynash</button><button class="btn ghost" onclick="go('setup')">SOZLAMALARGA QAYTISH</button>`;if(caught)h=civilianVictory({word:state.round.word,players:state.names.map((name,id)=>({name,id})),impostors:state.round.impostors,counts:state.voteTotals||outcome.counts,eliminated:outcome.eliminated})+'<button class="btn ghost victory-secondary" onclick="go(&quot;setup&quot;)">Sozlamalarga qaytish</button>'+victoryFooter("startLocal()",'Shu o‘yinchilar bilan yana o‘ynash');break;}
case'online':location.href='online.html';return;break;}$('#screen').innerHTML=h;document.body?.classList.toggle('civilian-win',state.screen==='result'&&h.includes('victory-hero'));}
function changeCategory(name,checked){state.categories=checked?[...new Set([...state.categories,name])]:state.categories.filter(x=>x!==name);render()}function categorySelectAll(all){state.categories=all?[...CATEGORY_LIST.map(c=>c.name),...(state.customWords.length>=3?['O‘z so‘zlarim']:[])]:[];render()}function closeLocalCategories(){if(!state.categories.length)return alert('Kamida bitta mavzuni tanlang');go('setup')}function editorTitle(title){return '<div class="editor-title"><button class="back" aria-label="Orqaga" onclick="go(\'setup\')">‹</button><h1>'+title+'</h1></div>'}function removeLocal(x){if(state.names.length<=3)return;state.names.splice(x,1);state.impostors=Math.min(state.impostors,state.names.length-2);render()}function saveDuration(){const n=+$('#custom-minutes').value;if(!Number.isInteger(n)||n<1||n>60)return alert('1–60 oralig‘ida butun son kiriting');state.minutes=n;go('setup')}function saveCustom(){const entries=$('#custom-words').value.split(/\n/).map(line=>{const split=line.indexOf('|');return {word:(split<0?line:line.slice(0,split)).trim().slice(0,50),hint:split<0?'':line.slice(split+1).trim().slice(0,120)}}).filter(x=>x.word);const words=[...new Set(entries.map(x=>x.word))].slice(0,100),hints=Object.create(null);if(words.length<3)return alert('Kamida 3 ta so‘z kiriting');for(const e of entries)if(words.includes(e.word)&&e.hint){if(!WordHints.isSingleWord(e.hint))return alert('Ishora faqat bitta so‘zdan iborat bo‘lsin: '+e.word);if(WordHints.revealsWord(e.word,e.hint))return alert('Ishorada maxfiy so‘zning o‘zini yozmang: '+e.word);hints[e.word]=e.hint}state.customWords=words;state.customHints=hints;WORDS['O‘z so‘zlarim']=words;try{localStorage.setItem('impostor-custom',JSON.stringify(words));localStorage.setItem('impostor-custom-hints',JSON.stringify(hints))}catch{}state.category='O‘z so‘zlarim';state.categories=['O‘z so‘zlarim'];go('setup')}function go(s){state.screen=s;state.running=false;render();window.scrollTo(0,0)}function resizePlayers(d){let n=state.names.length+d;if(n<3||n>15)return;if(d>0)state.names.push(`${n}-o‘yinchi`);else state.names.pop();state.impostors=Math.min(state.impostors,n-2);render()}function rand(n){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}function startLocal(){if(state.impostors*2>=state.names.length)return alert('Oddiy o‘yinchilar impostorlardan ko‘p bo‘lishi kerak');state.eliminated=[];state.cycle=1;state.lastVote=null;state.outcome=null;state.voteTotals={};if(!Number.isInteger(state.minutes)||state.minutes<1||state.minutes>60){alert('Vaqt 1–60 daqiqa bo‘lsin');return}state.names=state.names.map((x,i)=>x.trim()||`${i+1}-o‘yinchi`);const cats=state.categories.filter(x=>Object.hasOwn(WORDS,x));if(!cats.length){alert('Kamida bitta mavzuni tanlang');return}let cat=cats[rand(cats.length)],word=WORDS[cat][rand(WORDS[cat].length)];let indices=state.names.map((_,i)=>i);for(let i=indices.length-1;i>0;i--){let j=rand(i+1);[indices[i],indices[j]]=[indices[j],indices[i]]}const customHint=Object.hasOwn(state.customHints,word)?state.customHints[word]:null;state.round={word,hint:cat==='O‘z so‘zlarim'&&WordHints.isSingleWord(customHint)&&!WordHints.revealsWord(word,customHint)?customHint:WordHints.getHint(word,cat),image:WORD_PICTURES[word]||null,category:cat,impostors:indices.slice(0,state.impostors)};state.reveal=0;state.shown=false;state.seconds=state.minutes*60;state.selected=null;go('reveal')}function nextReveal(){state.shown=false;state.reveal++;if(state.reveal>=state.names.length){go('discuss');if(state.timed){state.running=true;render()}}else render()}function fmt(n){return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`}function startTicker(){state.timer=setInterval(()=>{if(state.seconds>0){state.seconds--;let e=$('#clock');if(e)e.textContent=fmt(state.seconds)}else{state.running=false;clearInterval(state.timer);beginLocalVote()}},1000)}function toggleTimer(){state.running=!state.running;render()}function localGuess(){const normalize=x=>String(x).normalize('NFKC').toLocaleLowerCase('uz').replace(/[‘’ʻʼ`]/g,"'").trim().replace(/\s+/g,' ');if(normalize($('#guess-word').value)===normalize(state.round.word)){state.outcome.winner='impostors';state.outcome.guessed=true}go('result')}function beginLocalVote(){state.voteRemaining=state.votingSeconds;state.votes=[];state.voter=state.names.findIndex((_,i)=>!state.eliminated.includes(i));state.selected=null;go('vote')}
function castVote(abstain=false){if(!abstain&&(state.selected===null||state.selected===state.voter||state.eliminated.includes(state.selected)||state.eliminated.includes(state.voter)))return;state.votes.push(abstain?null:state.selected);state.voteRemaining=state.votingSeconds;state.selected=null;let next=state.voter+1;while(next<state.names.length&&state.eliminated.includes(next))next++;if(next<state.names.length){state.voter=next;render();return}finishLocalVote()}function finishLocalVote(hostEnded=false){const outcome=RoundRules.resolve(state.names.map((_,i)=>i),state.round.impostors,state.eliminated,hostEnded||state.votes.filter(v=>v!==null).length>=Math.ceil((state.names.length-state.eliminated.length)/2)?state.votes.filter(v=>v!==null):[]);state.voteTotals=state.voteTotals||{};for(const [id,count]of Object.entries(outcome.counts))state.voteTotals[id]=(state.voteTotals[id]||0)+count;state.eliminated=outcome.eliminated;state.lastVote=outcome;if(outcome.winner){state.outcome=outcome;if(outcome.winner==='civilians'&&state.finalGuess){state.guessRemaining=20;go('guess')}else go('result')}else{state.cycle++;state.seconds=state.minutes*60;go('discuss');state.running=state.timed;render()}}
try{const savedHints=JSON.parse(localStorage.getItem('impostor-custom-hints')||'{}');if(savedHints&&typeof savedHints==='object'&&!Array.isArray(savedHints))state.customHints=Object.fromEntries(Object.entries(savedHints).filter(([word,hint])=>WordHints.isSingleWord(hint)&&hint.length<=120&&!WordHints.revealsWord(word,hint)));const words=JSON.parse(localStorage.getItem('impostor-custom')||'[]');if(Array.isArray(words)&&words.length>=3&&words.every(x=>typeof x==='string')){state.customWords=words.slice(0,100).map(x=>x.slice(0,50));WORDS['O‘z so‘zlarim']=state.customWords}}catch{}render();
